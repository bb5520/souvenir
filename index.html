 sb.auth.signInWithPassword({email:$("lge").value.trim(),password:$("lgp").value}).then(function(r){b.disabled=false;
  if(r.error){$("lgm").textContent=/fetch|network/i.test(r.error.message)?"網路連線失敗":"帳號或密碼錯誤";return}
  $("lgp").value="";authed=true;hideLogin();pull()}).catch(function(){b.disabled=false;$("lgm").textContent="網路連線失敗"})}
$("lgb").addEventListener("click",function(){if(sb)login();else $("lgm").textContent="尚未連線，請稍後再試"});
$("lgp").addEventListener("keydown",function(e){if(e.key==="Enter")$("lgb").click()});
$("out").addEventListener("click",function(){ask("確定登出嗎？這支手機上的本機資料會一併清除（雲端資料不受影響）。",function(){(sb?sb.auth.signOut():Promise.resolve()).catch(function(){}).then(wipe)},"登出")});
$("st").addEventListener("click",function(){dirty?doPush():pull()});
$("exp").addEventListener("click",function(){var b=new Blob([JSON.stringify(items)],{type:"application/json"}),n="souvenirs-"+new Date().toISOString().slice(0,10)+".json",f=new File([b],n,{type:"application/json"});
 if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(function(){})}else{var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},5000)}});
$("impb").addEventListener("click",function(){$("imp").click()});
$("imp").addEventListener("change",function(){var f=this.files[0];this.value="";if(!f)return;var r=new FileReader();r.onload=function(){try{var a=JSON.parse(r.result);if(!Array.isArray(a))throw 0;var have={};items.forEach(function(x){have[x.id]=1});
 a.forEach(function(x){if(x&&typeof x==="object"&&typeof x.id==="number"&&!have[x.id])items.push({id:x.id,store:String(x.store||""),qty:+x.qty||1,who:String(x.who||""),link:String(x.link||""),img:typeof x.img==="string"&&x.img.indexOf("data:image/")===0?x.img:"",rcpt:typeof x.rcpt==="string"&&x.rcpt.indexOf("data:image/")===0?x.rcpt:"",note:String(x.note||""),done:!!x.done})});
 save();render();toast("已匯入")}catch(e){toast("檔案格式不正確")}};r.readAsText(f)});
window.addEventListener("online",function(){doPush();pull()});
document.addEventListener("visibilitychange",function(){if(!document.hidden)pull()});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
function boot(){
 IDB.get("items").then(function(c){var had=false;if(c&&Array.isArray(c.items)){items=c.items;snap=c.snap||{};lastPull=c.lastPull||"";had=true}
  render();
  if(!sb){setSt("離線",1);if(had)hideLogin();return}
  sb.auth.onAuthStateChange(function(ev,ss){if(ev==="SIGNED_OUT"&&authed)wipe()});
  sb.auth.getSession().then(function(r){if(r.data&&r.data.session){authed=true;hideLogin();pull()}else showLogin()}).catch(function(){if(had){authed=true;hideLogin();setSt("離線",1)}})});
}
boot();
})();
</script>
</body>
</html>
